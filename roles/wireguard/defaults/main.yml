# The networks of a host are ump's (ump_private_networks); wireguard_networks,
# of the same shape, replaces them. See README.md and meta/argument_specs.yml.
# These go into the inventory (group_vars, host_vars), where the other hosts
# of a network see them.

# Groups of the host are its Ansible groups named here, unless wireguard_groups
# (a list for every network of the host, or a mapping of networks to lists)
# names them. Hosts with groups sharing none have no tunnel; a host with
# groups lets in new connections from the hosts sharing one alone.
wireguard_isolation: []

# Listen ports by network; a network not given gets one derived from its name.
wireguard_ports: {}

# Let the peers in through ofzhur.ansible.firewall.
wireguard_firewall: true

# A tunnel: wireguard_tunnel, unset here, names the gateway of the host,
# the peer its outgoing IPv4 leaves through. These IPv4 networks stay
# direct, beside link-local and main's routes but its default.
wireguard_tunnel_direct: []

# The mark (one bit) and the routing table of a tunneled host, and the
# first of the four priorities of its rules (a gateway's rules: that one).
wireguard_tunnel_mark: 0x2000
wireguard_tunnel_table: 32000
wireguard_tunnel_priority: 32000
