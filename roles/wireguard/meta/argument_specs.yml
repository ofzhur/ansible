argument_specs:
  main:
    short_description: A WireGuard mesh over the private networks of the hosts
    description:
      - One interface C(wg-NAME) per private network of the host, its peers the other hosts of the inventory in that network, isolated by group.
      - A host may send its outgoing IPv4 through a peer, its gateway (O(wireguard_tunnel)), which forwards and masquerades it.
      - The private key is generated on the host and never leaves it; the public key goes to the fact cache as C(wireguard_public_keys).
      - The variables go into the inventory (group_vars, host_vars), where the other hosts see them; a role parameter or a play variable fails the run.
      - A wrong type or an invalid network fails the run before any change.
    author: Oleg Zhurko (@ofzhur)
    options:
      wireguard_networks:
        description:
          - 'The private networks of the host, C({NAME: {address: 10.0.0.5, cidr: 10.0.0.0/24}}), in place of ump''s.'
          - Not set, those of ump, C(ump_private_networks), else C(ump_private_network), C(ump_private_address) and C(ump_private_cidr) of ump v0.5.0, else none.
          - C(NAME) is lower-case letters, digits, C(.), C(_) and C(-), at most 12 characters (the interface is C(wg-NAME)); C(cidr) an IPv4 network of C(/8) to C(/30), C(address) one of its hosts.
          - A network the host left loses its interface.
        type: dict
      wireguard_groups:
        description:
          - Groups of the host in place of its Ansible groups. A list holds for every network of the host, a mapping of networks to lists for the networks it names.
          - Not set for a network, the host's groups there are its Ansible groups named in O(wireguard_isolation).
          - Two hosts of a network are peers unless both have groups there and share none. A host with groups lets in new connections over the network from the peers sharing one alone (O(wireguard_firewall)).
        type: raw
      wireguard_isolation:
        description:
          - The Ansible groups that isolate their hosts, for the whole inventory (C(group_vars/all)).
        type: list
        elements: str
        default: []
      wireguard_ports:
        description:
          - 'Listen ports by network, C({NAME: PORT}).'
          - A network not given listens on 51820 plus the first 32 bits of the SHA-1 of its name modulo 1000 (51820 to 52819), the same on every host.
        type: dict
        default: {}
      wireguard_firewall:
        description:
          - Announce to C(ofzhur.ansible.firewall) the listen port of each network, open to the addresses of its peers, and the policy of its interface, new connections from the peers the host lets in.
          - C(false) withdraws the announcements.
        type: bool
        default: true
      wireguard_tunnel:
        description:
          - 'The gateway of the host: the peer its outgoing IPv4 leaves through, forwarded and masqueraded there. The inventory hostname of the peer, or C({host: NAME, network: NAME}) when the two share more than one network.'
          - Not set, no tunnel. The gateway is a peer of the host in that network, not the host itself, and has no tunnel of its own.
          - Incoming connections to the addresses of the host are answered directly; IPv6 gets no new outgoing connections; without the tunnel up, nothing leaves directly but what O(wireguard_tunnel_direct) and main's routes but its default name.
        type: raw
      wireguard_tunnel_direct:
        description:
          - IPv4 networks a tunneled host reaches directly, beside link-local C(169.254.0.0/16) and the routes of the table main but its default.
        type: list
        elements: str
        default: []
      wireguard_tunnel_mark:
        description:
          - The firewall mark of a tunneled host, one bit (a power of two up to C(0x80000000)), set and matched alone, other bits kept; the same bit of the conntrack mark. WireGuard's own packets and the connections from outside carry it, and leave directly.
        type: int
        default: 0x2000
      wireguard_tunnel_table:
        description:
          - The routing table of a tunneled host, its default route through the interface of the tunnel. Not C(253), C(254), C(255) (default, main, local).
        type: int
        default: 32000
      wireguard_tunnel_priority:
        description:
          - The priority of the first of the four routing rules of a tunneled host, which take it to three after; a gateway's rules take it alone. At most C(32762), before the rule of main.
        type: int
        default: 32000
