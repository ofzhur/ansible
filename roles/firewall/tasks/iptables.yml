# Check mode needs python3-apt; without it, the package is left out.
- name: Install iptables
  ansible.builtin.apt:
    name: iptables
    install_recommends: false
    update_cache: true  # only when missing, with fresh lists: an installed system may have none
  when: >-
    'apt' in __firewall_host and 'have iptables' not in __firewall_host
    and ('python3-apt' in __firewall_host or not ansible_check_mode)

# ansible.builtin has no pacman module (community.general has).
- name: Install iptables
  ansible.builtin.command: pacman -S --needed --noconfirm iptables
  args:
    creates: /usr/sbin/iptables-restore
  when: "'pacman' in __firewall_host"

- name: Directory /etc/iptables
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: "0755"

# The whole table filter of each family, checked before it is put in place.
- name: Rules
  ansible.builtin.template:
    src: iptables.rules.j2
    dest: /etc/iptables/rules.v{{ __firewall_family }}
    owner: root
    group: root
    mode: "0644"
    validate: "{{ 'iptables' if __firewall_family == 4 else 'ip6tables' }}-restore --test %s"
  loop: [4, 6]
  loop_control:
    loop_var: __firewall_family
  register: __firewall_rules_files

- name: Unit that loads the rules at boot
  ansible.builtin.template:
    src: ofzhur-iptables.service.j2
    dest: /etc/systemd/system/ofzhur-iptables.service
    owner: root
    group: root
    mode: "0644"
  register: __firewall_unit

# Switching from nftables, the role's or ump's: stopping nftables.service
# empties the whole ruleset, so before the rules are applied.
- name: Remove the nftables ruleset
  when: >-
    'nftables.conf role' in __firewall_host
    or 'nftables.conf ump' in __firewall_host
    or 'table inet ofzhur' in __firewall_host
  block:
    - name: Stop loading the nftables ruleset at boot
      ansible.builtin.systemd_service:
        name: nftables
        enabled: false
        state: stopped

    - name: Remove the nftables tables
      ansible.builtin.shell: |
        for t in 'inet ofzhur' 'inet filter'; do
          nft list table $t >/dev/null 2>&1 && nft delete table $t
        done
        true
      changed_when: true
      register: __firewall_nftables_removed

    - name: Remove /etc/nftables.conf
      ansible.builtin.file:
        path: /etc/nftables.conf
        state: absent

# Also when the files are not what was applied last (a run cut short).
- name: Apply the rules
  ansible.builtin.command: "{{ 'iptables' if __firewall_family == 4 else 'ip6tables' }}-restore /etc/iptables/rules.v{{ __firewall_family }}"
  loop: [4, 6]
  loop_control:
    loop_var: __firewall_family
  when: >-
    __firewall_rules_files is changed
    or 'applied ' ~ __firewall_applied not in __firewall_host
    or 'iptables drop' not in __firewall_host
    or __firewall_nftables_removed is changed
  changed_when: true

- name: Record what was applied
  ansible.builtin.copy:
    content: "{{ __firewall_applied }}\n"
    dest: /etc/ofzhur/firewall.applied
    owner: root
    group: root
    mode: "0644"

- name: Load the rules at boot
  ansible.builtin.systemd_service:
    name: ofzhur-iptables
    daemon_reload: "{{ __firewall_unit is changed }}"
    enabled: true
    state: started
  when: "'ofzhur-iptables.service' in __firewall_host or not ansible_check_mode"
