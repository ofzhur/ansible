# Check mode needs python3-apt; without it, the package is left out.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    install_recommends: false
    update_cache: true  # only when missing, with fresh lists: an installed system may have none
  when: >-
    'apt' in __firewall_host and 'have nft' not in __firewall_host
    and ('python3-apt' in __firewall_host or not ansible_check_mode)

# ansible.builtin has no pacman module (community.general has).
- name: Install nftables
  ansible.builtin.command: pacman -S --needed --noconfirm nftables
  args:
    creates: /usr/sbin/nft
  when: "'pacman' in __firewall_host"

# The whole of /etc/nftables.conf, checked before it is put in place.
- name: Ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s
  register: __firewall_ruleset

# One transaction: the table of ump (or of the distribution) goes, the
# role's is replaced whole, nothing else is touched. Also when the file is
# not what was applied last (a run cut short), or the table is not there:
# a flush, a reboot without nftables.service.
- name: Apply the ruleset
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: >-
    __firewall_ruleset is changed
    or 'applied ' ~ __firewall_applied not in __firewall_host
    or 'table inet ofzhur' not in __firewall_host
    or 'table inet filter' in __firewall_host
  changed_when: true

- name: Record what was applied
  ansible.builtin.copy:
    content: "{{ __firewall_applied }}\n"
    dest: /etc/ofzhur/firewall.applied
    owner: root
    group: root
    mode: "0644"

# nftables.service touches the role's table alone, other software's stay:
# its stop deletes the role's table, where the unit of Debian and Ubuntu
# flushes the whole ruleset. Written once the ruleset is in place, loaded
# right after; by the next run, when this one is cut short in between.
- name: Directory of the drop-in of nftables.service
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop-in of nftables.service
  ansible.builtin.template:
    src: nftables.service.conf.j2
    dest: /etc/systemd/system/nftables.service.d/ofzhur-firewall.conf
    owner: root
    group: root
    mode: "0644"
  register: __firewall_dropin

- name: Load the ruleset at boot
  ansible.builtin.systemd_service:
    name: nftables
    daemon_reload: "{{ __firewall_dropin is changed or 'daemon-reload' in __firewall_host }}"
    enabled: true
    state: started
  when: "'have nft' in __firewall_host or not ansible_check_mode"

# Switching from iptables: after the ruleset above is in place, so that a
# firewall is up all along. The role's chain goes, other software's rules
# stay; the layout of 0.4.0, where the whole table filter was the role's,
# is emptied as 0.4.0 did.
- name: Remove the iptables rules
  when: "'ofzhur-iptables.service' in __firewall_host"
  block:
    - name: Stop loading the iptables rules at boot
      ansible.builtin.systemd_service:
        name: ofzhur-iptables
        enabled: false
        state: stopped

    - name: Remove the role's chain
      ansible.builtin.shell: |
        {% set c = 'iptables' if __firewall_family == 4 else 'ip6tables' %}
        {% if 'iptables 0.4.0 ' ~ __firewall_family in __firewall_host %}
        if {{ c }} -V | grep -q nf_tables; then
          if nft list table {{ 'ip' if __firewall_family == 4 else 'ip6' }} filter >/dev/null 2>&1; then
            nft delete table {{ 'ip' if __firewall_family == 4 else 'ip6' }} filter
          fi
        else
          printf '*filter\n:INPUT ACCEPT [0:0]\n:FORWARD ACCEPT [0:0]\n:OUTPUT ACCEPT [0:0]\nCOMMIT\n' | {{ c }}-restore -w
        fi
        {% else %}
        while {{ c }} -w -D INPUT -j OFZHUR-INPUT 2>/dev/null; do :; done
        if {{ c }} -w -S OFZHUR-INPUT >/dev/null 2>&1; then
          {{ c }} -w -F OFZHUR-INPUT && {{ c }} -w -X OFZHUR-INPUT
        fi
        {% endif %}
      loop: "{{ __firewall_families }}"
      loop_control:
        loop_var: __firewall_family
      changed_when: true

    # Also 0.4.0's rules.v4 and rules.v6, where the role wrote them.
    - name: Remove the iptables files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ ['/etc/systemd/system/ofzhur-iptables.service', '/etc/iptables/ofzhur-firewall.v4', '/etc/iptables/ofzhur-firewall.v6']
           + __firewall_host | select('match', '0.4.0 file ') | map('regex_replace', '^0.4.0 file ', '') | list }}

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
