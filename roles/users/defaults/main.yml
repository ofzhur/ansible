# OS users and groups; see README.md and meta/argument_specs.yml.
users: []
users_groups: []

# Shell of a user without one.
users_shell: /bin/bash

# Users that no entry may remove, give keys or take sudo from: root and
# the server's administrator, ump_admin, whom ump's own runs log in as.
# Not the user a person logs in as (-u): their own entry manages them.
users_protected: "{{ ['root'] + ([ump_admin] if ump_admin is defined else []) }}"
