#
# The base of every server ump installs (the group common); more roles
# join later. An infrastructure repository runs it from its playbooks/,
# such as playbooks/00-base.yml:
#
#   - import_playbook: ofzhur.ansible.base

- name: Base
  hosts: common
  become: true
  roles:
    - ofzhur.ansible.users
