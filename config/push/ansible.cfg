#
# Ansible configuration for the push strategy: Ansible runs on a control
# machine (a laptop, a bastion, CI) and reaches every server over SSH.
#
# Template from the collection ofzhur.ansible (config/push/ansible.cfg).
# Copy it to the root of an infrastructure repository and run Ansible from
# there: Ansible reads ./ansible.cfg from the current directory only.
# Relative paths are relative to this file.

[defaults]
# One directory: hosts/ with one file per server (ofzhur.ansible.host,
# written by ump), groups.yml with the static group tree, group_vars/ and
# host_vars/ for everything set by hand.
inventory = inventory
# Collections come from the repository only: ofzhur.ansible as a git
# submodule, others by `ansible-galaxy collection install -p collections`.
collections_path = collections
collections_scan_sys_path = false
roles_path = roles
forks = 20
interpreter_python = auto_silent
# Facts are gathered on every play and kept between runs, so a run limited
# to some servers still knows the facts of the others.
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 604800
callback_result_format = yaml

[inventory]
# Host files first, then YAML only: ini would take an empty host file as
# an empty inventory and lose its server. host_list keeps `-i 10.0.0.1,`.
enable_plugins = ofzhur.ansible.host, host_list, auto, yaml
# A file that cannot be read fails the run instead of losing its hosts.
any_unparsed_is_failed = true

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = true
# A new server's host key is accepted on first contact, a changed one is
# refused (ump forgets the old key when it reinstalls a server). The
# control machine's SSH agent is never forwarded to a server.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ForwardAgent=no
