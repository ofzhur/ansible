#
# Ansible configuration for a control machine (a laptop, a bastion, CI):
# Ansible runs there and reaches every server over SSH.
#
# Template from the collection ofzhur.ansible (config/push/ansible.cfg).
# Copy it to the root of an infrastructure repository and run Ansible from
# there: Ansible reads ./ansible.cfg from the current directory only.
# Relative paths are relative to this file.

[defaults]
# One directory: the servers, groups.yml with the static group tree,
# group_vars/ and host_vars/ for everything set by hand. The servers come
# from one of
#   hosts/     a host file per server (ofzhur.ansible.host, written by ump)
#   hosts.yml  the host files in a storage (plugin: ofzhur.ansible.host,
#              url: its URL; written by ump)
#   ump.yml    ump itself (plugin: ofzhur.ansible.ump)
inventory = inventory
# Collections come from the repository only: ofzhur.ansible as a git
# submodule, others by `ansible-galaxy collection install -p collections`.
collections_path = collections
collections_scan_sys_path = false
roles_path = roles
forks = 20
interpreter_python = auto_silent
# Facts are gathered on every play and kept between runs, so a run limited
# to some servers still knows the facts of the others. To share them with
# the other machines running Ansible: fact_caching = ofzhur.ansible.facts,
# fact_caching_connection = the URL of a storage.
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 604800
callback_result_format = yaml

[inventory]
# Host files first, then YAML only: ini would take an empty host file as
# an empty inventory and lose its server. host_list keeps `-i 10.0.0.1,`.
enable_plugins = ofzhur.ansible.host, host_list, auto, yaml
# A file or a storage that cannot be read fails the run instead of losing
# its hosts.
any_unparsed_is_failed = true

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = true
# A new server's host key is accepted on first contact, a changed one is
# refused (ump forgets the old key when it reinstalls a server). The
# control machine's SSH agent is never forwarded to a server.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ForwardAgent=no

# The storage of the facts (ofzhur.ansible.facts) and of the host files
# (inventory/hosts.yml): its options and credentials, which ump reads too;
# never AWS_*, CONSUL_HTTP_TOKEN or VAULT_TOKEN (those of ump's state). A
# file wins over a value.
#[ofzhur_storage]
#access_key_file = secrets/storage.access_key
#secret_key_file = secrets/storage.secret_key
